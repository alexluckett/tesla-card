<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>card shot</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        padding: 18px;
        font: 13px Roboto, sans-serif;
      }
      body.dark {
        background: #111;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --divider-color: rgba(225, 225, 225, 0.12);
        --card-background-color: #1c1c1c;
        --ha-card-background: #1c1c1c;
      }
      body.light {
        background: #f2f3f5;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --divider-color: rgba(0, 0, 0, 0.12);
        --card-background-color: #fff;
        --ha-card-background: #fff;
      }
      :root {
        --primary-color: #03a9f4;
        --warning-color: #ffa726;
        --success-color: #43a047;
        --ha-font-family-body: Roboto, sans-serif;
      }
      tesla-fleet-card {
        display: block;
        width: 460px;
      }
    </style>
  </head>
  <body>
    <script type="module">
      if (!customElements.get('ha-card')) {
        customElements.define(
          'ha-card',
          class extends HTMLElement {
            connectedCallback() {
              this.style.cssText =
                'display:block;background:var(--ha-card-background);' +
                'border:1px solid var(--divider-color);border-radius:12px;'
            }
          }
        )
      }

      /**
       * The route the car is driving, west to east: out of one town, along a
       * main road, into the next. Everything on the map is defined in the same
       * latitude and longitude as the journey, so the trail runs along the
       * road instead of across whatever the illustration happened to contain.
       */
      const ROAD = [
        [51.44, -1.02],
        [51.4495, -0.962],
        [51.4605, -0.902],
        [51.4702, -0.845],
        [51.4772, -0.788],
        [51.487, -0.73],
        [51.4972, -0.666],
        [51.5074, -0.6]
      ]
      /**
       * Where the car has got to: the trail must end exactly at its marker,
       * so both come from the same slice of the road rather than being
       * written out twice and drifting apart.
       */
      const AT = 5
      const DRIVEN = ROAD.slice(0, AT + 1)
      const CAR = ROAD[AT]
      const DESTINATION = ROAD[ROAD.length - 1]
      const TOWNS = [
        { at: ROAD[0], name: 'Marlow End', r: 0.016 },
        { at: ROAD[ROAD.length - 1], name: 'Aldbury', r: 0.019 }
      ]
      // Side roads leaving the main one, long enough to read as junctions
      // rather than tick marks.
      const LANES = [
        [
          [51.4605, -0.902],
          [51.4835, -0.9125]
        ],
        [
          [51.4772, -0.788],
          [51.4548, -0.7775]
        ],
        [
          [51.4972, -0.666],
          [51.5155, -0.6815]
        ]
      ]
      // Open country either side of the road, large enough to read as fields.
      const GREEN = [
        [
          [51.4735, -0.978],
          [51.4905, -0.955],
          [51.4952, -0.878],
          [51.4838, -0.845],
          [51.4708, -0.882]
        ],
        [
          [51.4478, -0.792],
          [51.4592, -0.742],
          [51.4562, -0.652],
          [51.4415, -0.672]
        ],
        [
          [51.5008, -0.86],
          [51.5105, -0.815],
          [51.5062, -0.742],
          [51.4952, -0.775]
        ]
      ]

      // Home Assistant renders the map itself. This stand-in projects the same
      // coordinates the card hands over, so what is drawn is the card's own
      // output on a coherent piece of ground.
      if (!customElements.get('ha-map')) {
        customElements.define(
          'ha-map',
          class extends HTMLElement {
            constructor() {
              super()
              this._drawn = []
              this.Leaflet = {
                polyline: (points, opts) => {
                  this._drawn.push({ points, opts })
                  return { __layer: true }
                }
              }
              this._props = {}
              for (const name of ['entities', 'paths', 'layers']) {
                Object.defineProperty(this, name, {
                  get: () => this._props[name],
                  set: (v) => {
                    this._props[name] = v
                    this._schedule()
                  }
                })
              }
            }
            _schedule() {
              clearTimeout(this._t)
              this._t = setTimeout(() => this._draw(), 0)
            }
            connectedCallback() {
              this._schedule()
            }
            _draw() {
              const dark = document.body.classList.contains('dark')
              const paths = this.paths || []
              const cs = getComputedStyle(this)
              const size = parseFloat(cs.getPropertyValue('--ha-marker-size')) || 48
              const cardBg = dark ? '#1c1c1c' : '#ffffff'

              const marks = []
              for (const e of this.entities || []) {
                const id = typeof e === 'string' ? e : e.entity_id
                const colour = typeof e === 'string' ? '#03a9f4' : e.color
                const a = window.__hass?.states?.[id]?.attributes
                if (a && typeof a.latitude === 'number') {
                  marks.push({ at: [a.latitude, a.longitude], colour })
                }
              }

              // Fit the road as well as the journey, so both towns are in view.
              const all = [
                ...ROAD,
                ...marks.map((m) => m.at),
                ...paths.flatMap((p) => p.points.map((q) => q.point)),
                ...(this._drawn || []).flatMap((d) => d.points)
              ]
              if (!all.length) return

              const lats = all.map((p) => p[0])
              const lons = all.map((p) => p[1])
              const w = 460
              const h = 170
              // One scale for both axes, as a real map has.
              const midLat = (Math.max(...lats) + Math.min(...lats)) / 2
              const kx = Math.cos((midLat * Math.PI) / 180) || 1
              const cLon = (Math.max(...lons) + Math.min(...lons)) / 2
              const spanLat = Math.max(...lats) - Math.min(...lats) || 0.02
              const spanLon = (Math.max(...lons) - Math.min(...lons)) * kx || 0.02
              const scale = Math.min(w / (spanLon * 1.18), h / (spanLat * 1.5))
              const x = (lon) => w / 2 + (lon - cLon) * kx * scale
              const y = (lat) => h / 2 - (lat - midLat) * scale

              const land = dark ? '#15181b' : '#f4f5f2'
              const built = dark ? '#20242a' : '#e8e8e4'
              const green = dark ? '#1a2620' : '#e3ecdd'
              const road = dark ? '#3a424a' : '#ffffff'
              const casing = dark ? '#252a30' : '#e0e4de'
              const label = dark ? '#79818b' : '#7a828c'

              const line = (pts) =>
                pts.map((p, i) => `${i ? 'L' : 'M'} ${x(p[1]).toFixed(1)} ${y(p[0]).toFixed(1)}`).join(' ')
              const pathEl = (p, extra) =>
                `<path d="${p.points
                  .map((q, i) => `${i ? 'L' : 'M'} ${x(q.point[1]).toFixed(1)} ${y(q.point[0]).toFixed(1)}`)
                  .join(' ')}" fill="none" stroke="${p.color}"
                  stroke-linecap="round" stroke-linejoin="round" ${extra}/>`

              this.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%">
                <rect width="${w}" height="${h}" fill="${land}"/>
                ${GREEN.map((g) => `<path d="${line(g)} Z" fill="${green}"/>`).join('')}
                ${TOWNS.map(
                  (t) =>
                    `<circle cx="${x(t.at[1]).toFixed(1)}" cy="${y(t.at[0]).toFixed(1)}"
                      r="${(t.r * scale).toFixed(1)}" fill="${built}"/>`
                ).join('')}
                ${LANES.map((l) => `<path d="${line(l)}" fill="none" stroke="${casing}" stroke-width="5"/>`).join('')}
                ${LANES.map((l) => `<path d="${line(l)}" fill="none" stroke="${road}" stroke-width="2.6"/>`).join('')}
                <path d="${line(ROAD)}" fill="none" stroke="${casing}" stroke-width="11"
                  stroke-linecap="round" stroke-linejoin="round"/>
                <path d="${line(ROAD)}" fill="none" stroke="${road}" stroke-width="7"
                  stroke-linecap="round" stroke-linejoin="round"/>
                ${TOWNS.map(
                  (t, i) =>
                    `<text x="${x(t.at[1]).toFixed(1)}" y="${(y(t.at[0]) + (i ? -18 : 22)).toFixed(1)}"
                      fill="${label}" font-size="9.5" font-family="Roboto,sans-serif"
                      text-anchor="middle">${t.name}</text>`
                ).join('')}
                ${paths
                  .flatMap((p) => {
                    if (!p.gradualOpacity) return [pathEl(p, 'stroke-width="3"')]
                    const step = p.gradualOpacity / Math.max(p.points.length - 2, 1)
                    const base = 1 - p.gradualOpacity
                    const out = []
                    for (let i = 0; i < p.points.length - 1; i++) {
                      const o = (base + i * step).toFixed(3)
                      out.push(
                        pathEl(
                          { points: [p.points[i], p.points[i + 1]], color: p.color },
                          `stroke-width="3.4" opacity="${o}"`
                        )
                      )
                      out.push(
                        `<circle cx="${x(p.points[i].point[1]).toFixed(1)}"
                          cy="${y(p.points[i].point[0]).toFixed(1)}" r="2.6"
                          fill="${p.color}" opacity="${o}"/>`
                      )
                    }
                    return out
                  })
                  .join('')}
                ${(this._drawn || [])
                  .map((d) =>
                    pathEl(
                      { points: d.points.map((pt) => ({ point: pt })), color: d.opts.color },
                      `stroke-width="2.2"${d.opts.dashArray ? ` stroke-dasharray="${d.opts.dashArray}"` : ''}`
                    )
                  )
                  .join('')}
                ${marks
                  .map(
                    (m) =>
                      `<circle cx="${x(m.at[1]).toFixed(1)}" cy="${y(m.at[0]).toFixed(1)}"
                        r="${(size / 2).toFixed(1)}" fill="${cardBg}"
                        stroke="${m.colour}" stroke-width="1.5"/>`
                  )
                  .join('')}
              </svg>`
              this.style.cssText = 'display:block;line-height:0'
            }
          }
        )
      }

      await import('../dist/tesla-card.js')

      const DEVICE = 'dev_my'
      const KEYS = {
        battery: 'sensor:charge_state_battery_level',
        range: 'sensor:charge_state_battery_range',
        chargingState: 'sensor:charge_state_charging_state',
        chargeLimit: 'number:charge_state_charge_limit_soc',
        speed: 'sensor:drive_state_speed',
        shiftState: 'sensor:drive_state_shift_state',
        online: 'binary_sensor:state',
        locked: 'lock:vehicle_state_locked',
        location: 'device_tracker:location',
        route: 'device_tracker:route',
        arrivalTime: 'sensor:drive_state_active_route_minutes_to_arrival',
        distanceToArrival: 'sensor:drive_state_active_route_miles_to_arrival',
        destination: 'sensor:drive_state_active_route_destination',
        chargeSwitch: 'switch:charge_state_charging_state',
        sentry: 'switch:vehicle_state_sentry_mode',
        climate: 'climate:driver_temp',
        wake: 'button:wake'
      }

      function makeHass(values) {
        const entities = {}
        const states = {}
        for (const [name, v] of Object.entries(values)) {
          const [domain, key] = (KEYS[name] || 'sensor:x').split(':')
          const id = `${domain}.model_y_${name}`
          entities[id] = { entity_id: id, device_id: DEVICE, platform: 'tesla_fleet', translation_key: key }
          states[id] = {
            entity_id: id,
            state: v.state,
            attributes: v.attributes ?? {},
            last_updated: v.last_updated ?? new Date(Date.now() - 4 * 60000).toISOString()
          }
        }
        const hass = {
          entities,
          states,
          devices: {
            [DEVICE]: { id: DEVICE, name: 'Model Y', model: 'Model Y', serial_number: '7SAYGDEF9TA123456' }
          },
          config: { country: 'GB' },
          locale: { language: 'en-GB' },
          callService: async () => {},
          connection: {
            subscribeMessage: (cb, msg) => {
              if (msg?.type === 'history/stream') {
                const now = Math.floor(Date.now() / 1000)
                // Five fixes eight minutes apart, which is about what a
                // ten-minute poll gives you on a forty minute drive.
                const track = DRIVEN
                const states = track.map(([lat, lon], i) => ({
                  a: { latitude: lat, longitude: lon },
                  lu: now - (track.length - 1 - i) * 480
                }))
                queueMicrotask(() => cb({ states: { [msg.entity_ids[0]]: states } }))
              }
              return Promise.resolve(() => {})
            }
          }
        }
        window.__hass = hass
        return hass
      }

      const parked = {
        battery: { state: '71' },
        range: { state: '198', attributes: { unit_of_measurement: 'mi' } },
        chargingState: { state: 'disconnected' },
        shiftState: { state: 'p' },
        speed: { state: 'unknown' },
        online: { state: 'on' },
        locked: { state: 'locked' },
        location: { state: 'home', attributes: { latitude: 51.5074, longitude: -0.1278 } },
        chargeLimit: { state: '80' }
      }
      const controlsOff = {
        chargeSwitch: { state: 'off' },
        climate: { state: 'off' },
        sentry: { state: 'off' },
        wake: { state: 'unknown' }
      }
      const navigating = {
        ...parked,
        battery: { state: '54' },
        range: { state: '151', attributes: { unit_of_measurement: 'mi' } },
        shiftState: { state: 'd' },
        speed: { state: '38', attributes: { unit_of_measurement: 'mph' } },
        locked: { state: 'unlocked' },
        location: { state: 'not_home', attributes: { latitude: CAR[0], longitude: CAR[1] } },
        route: {
          state: 'not_home',
          attributes: { latitude: DESTINATION[0], longitude: DESTINATION[1] }
        },
        arrivalTime: { state: new Date(Date.now() + 20 * 60000).toISOString() },
        distanceToArrival: { state: '14', attributes: { unit_of_measurement: 'mi' } },
        destination: { state: 'Home' }
      }

      const CASES = {
        parked: ['dark', parked, {}],
        charging: [
          'dark',
          { ...parked, battery: { state: '63' }, range: { state: '176', attributes: { unit_of_measurement: 'mi' } }, chargingState: { state: 'charging' } },
          {}
        ],
        navigating: ['dark', navigating, { map: 'never' }],
        navigating_map: ['dark', navigating, {}],
        asleep: ['dark', { ...parked, online: { state: 'off' } }, {}],
        low: ['dark', { ...parked, battery: { state: '12' } }, {}],
        controls_rest: ['dark', { ...parked, ...controlsOff }, { controls: true }],
        controls_active: [
          'dark',
          {
            ...parked,
            chargingState: { state: 'charging' },
            locked: { state: 'unlocked' },
            chargeSwitch: { state: 'on' },
            climate: { state: 'heat_cool', attributes: { temperature: 21 } },
            sentry: { state: 'on' },
            wake: { state: 'unknown' }
          },
          { controls: true }
        ],
        map: ['dark', navigating, { map: 'always' }],
        light: ['light', parked, { paint: 'pearl_white' }],
        light_nav: ['light', navigating, { map: 'always', paint: 'pearl_white' }]
      }

      const which = location.hash.slice(1) || 'parked'
      const [theme, values, config] = CASES[which]
      document.body.className = theme
      const card = document.createElement('tesla-fleet-card')
      card.setConfig({ device_id: DEVICE, units: 'imperial', paint: 'pearl_white', ...config })
      card.hass = makeHass(values)
      document.body.append(card)
      await card.updateComplete
      console.log('[shot] ' + which)
    </script>
  </body>
</html>
